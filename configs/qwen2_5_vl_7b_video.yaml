# Qwen2.5-VL-7B on multi-frame (video) questions; 4-8x80GB with DeepSpeed ZeRO-3
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
dtype: bfloat16
attn_implementation: flash_attention_2
use_peft: true
lora_r: 64
lora_alpha: 128
lora_target_modules: [q_proj, k_proj, v_proj, o_proj]

data_dir: data/ssb
modality: video
max_frames: 8

output_dir: outputs/spatial-r1-qwen2.5vl-7b-video
learning_rate: 5.0e-6
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
num_generations: 8
max_completion_length: 768
beta: 0.0
loss_type: dapo
epsilon_high: 0.28     # DAPO clip-higher
scale_rewards: false
bf16: true
gradient_checkpointing: true
logging_steps: 5
save_steps: 200
report_to: [wandb]
seed: 42
